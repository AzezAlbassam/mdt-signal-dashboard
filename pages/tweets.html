<title>دفتر التغريدات</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@600;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one column, a week at a time — a week bar, then that week's tweets in posting order, each as a
   post-shaped card ready to copy; the idea bank folded at the bottom. Dark first, like the timeline it feeds. */
:root {
  --bg: #0e141a; --panel: #151d25; --soft: #1b2530; --line: #273441; --fg: #e8eef3; --muted: #8d9aa7;
  --accent: #3ea6f2; --good: #34c27a; --warn: #e9a33a;
  --display: "Noto Kufi Arabic", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --body: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f4f6f8; --panel: #ffffff; --soft: #eef2f5; --line: #d9e0e6; --fg: #0f1720; --muted: #5b6874;
  --accent: #1574c4; --good: #17864f; --warn: #a76506; color-scheme: light } }
:root[data-theme="light"] {
  --bg: #f4f6f8; --panel: #ffffff; --soft: #eef2f5; --line: #d9e0e6; --fg: #0f1720; --muted: #5b6874;
  --accent: #1574c4; --good: #17864f; --warn: #a76506; color-scheme: light }

body { background: var(--bg); color: var(--fg); font: 15px/1.75 var(--body); }
.wrap { max-width: 720px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; }
h1 { font: 800 clamp(24px, 5vw, 32px)/1.3 var(--display); margin: 0; text-wrap: balance; }
h2 { font: 600 18px/1.4 var(--display); margin: 0; }
p { margin: 0; }
.lead { color: var(--muted); max-width: 62ch; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.weekbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.weekbar .lbl { flex: 1; min-width: 0; display: grid; }
.weekbar .lbl b { font: 600 16px var(--display); }
.weekbar .lbl small { color: var(--muted); }
.nav { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--soft); color: var(--fg); font-size: 18px; }
.nav:disabled { opacity: .35; cursor: default; }

.list { display: grid; gap: 16px; }
.tw { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.tw.posted { border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
.head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.day { font: 600 15px var(--display); }
.chip { font-size: 12px; padding: 2px 10px; border-radius: 99px; background: var(--soft); border: 1px solid var(--line); color: var(--muted); }
.state { margin-inline-start: auto; font-size: 12px; font-weight: 600; }
.state.draft { color: var(--warn); } .state.done { color: var(--good); }
.title { color: var(--muted); font-size: 14px; }
.body { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 16px; line-height: 1.85; background: var(--soft); border-radius: 12px; padding: 14px 16px; }
.body .tag { color: var(--accent); font-weight: 600; unicode-bidi: isolate; direction: ltr; }
.foot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.count { color: var(--muted); font: 500 12px var(--mono); }
.btn { border: 1px solid var(--line); background: var(--soft); color: var(--fg); border-radius: 99px; padding: 6px 16px; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.ok { border-color: var(--good); color: var(--good); }
details.src summary { cursor: pointer; color: var(--muted); font-size: 13px; }
details.src ul { margin: 8px 0 0; padding-inline-start: 18px; display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.empty { background: var(--panel); border: 1px dashed var(--line); border-radius: 16px; padding: 22px; display: grid; gap: 6px; }
.empty b { font: 600 16px var(--display); }
details.bank { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
details.bank summary { cursor: pointer; font: 600 16px var(--display); }
.ideas { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.ideas li { display: grid; gap: 2px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.ideas li:last-child { border-bottom: 0; }
.ideas .used { color: var(--good); font-size: 12px; }
.toast { position: fixed; inset-inline: 0; bottom: max(16px, env(safe-area-inset-bottom, 0px)); margin: 0 auto; width: fit-content; background: var(--fg); color: var(--bg); padding: 8px 16px; border-radius: 99px; font-weight: 600; }
@media (prefers-reduced-motion: no-preference) { .tw { transition: border-color .2s; } }
</style>

<div class="wrap">
  <header style="display:grid;gap:6px">
    <h1>دفتر التغريدات</h1>
    <p class="lead">تغريدة جديدة كل يومين بفكرة مختلفة، أرقامها من TradingView ومتحقق منها. انسخها وانشرها، وعلّم عليها إنها نُشرت.</p>
  </header>
  <nav class="weekbar" aria-label="الأسابيع">
    <button class="nav" id="next" type="button" aria-label="الأسبوع اللي بعده">›</button>
    <div class="lbl"><b id="weekName">هالأسبوع</b><small id="weekRange"></small></div>
    <button class="nav" id="prev" type="button" aria-label="الأسبوع اللي قبله">‹</button>
  </nav>
  <section class="list" id="list" aria-live="polite">
    <div class="empty"><b>جاري تحميل التغريدات…</b><p class="lead">أول ما توصل، تطلع هنا مرتبة حسب يوم نشرها.</p></div>
  </section>
  <details class="bank" id="bank"><summary>بنك الأفكار</summary><p class="lead" style="margin-top:8px">كل تغريدة تاخذ فكرة ما انكتبت قريب، عشان ما تتكرر.</p><ul class="ideas" id="ideas"></ul></details>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id)
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
  const FAMILY = { market: 'قراءة السوق', company: 'تحليل شركة', valuation: 'تقييم', compounding: 'العائد المركب', etf: 'صناديق', halal: 'استثمار شرعي', earnings: 'نتائج', dividends: 'توزيعات', saudi: 'السوق السعودي', history: 'تاريخ', myth: 'خرافة وأرقام', 'data-study': 'من اختباراتنا', comparison: 'مقارنة', risk: 'مخاطر', behaviour: 'سلوك المستثمر', macro: 'اقتصاد' }
  let tweets = []
  let ideas = []
  let db = null
  let week = null

  // Weeks run Sunday to Saturday (the Saudi week); keys are the Sunday's date.
  const sundayOf = (iso) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() - d.getUTCDay()); return d.toISOString().slice(0, 10) }
  const addDays = (iso, k) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + k); return d.toISOString().slice(0, 10) }
  const fmtDay = (iso, opts) => new Date(iso + 'T12:00:00Z').toLocaleDateString('ar-SA-u-ca-gregory-nu-latn', { timeZone: 'UTC', ...opts })
  const weeks = () => [...new Set(tweets.map((t) => sundayOf(t.date)))].sort()
  const today = new Date().toISOString().slice(0, 10)

  function pick() {
    const ws = weeks()
    const h = location.hash.replace(/^#w-/, '')
    week = ws.includes(h) ? h : ws.includes(sundayOf(today)) ? sundayOf(today) : ws.at(-1) ?? sundayOf(today)
  }

  const deco = (text) => esc(text).replace(/(^|[\s(])([$#][A-Za-z؀-ۿ_][\w.؀-ۿ]*)/g, '$1<span class="tag">$2</span>')

  function render() {
    const ws = weeks()
    const i = ws.indexOf(week)
    $('weekName').textContent = week === sundayOf(today) ? 'هالأسبوع' : `أسبوع ${fmtDay(week, { day: 'numeric', month: 'long' })}`
    $('weekRange').textContent = `${fmtDay(week, { day: 'numeric', month: 'long' })} – ${fmtDay(addDays(week, 6), { day: 'numeric', month: 'long', year: 'numeric' })}`
    $('prev').disabled = i <= 0
    $('next').disabled = i < 0 || i >= ws.length - 1
    const list = tweets.filter((t) => sundayOf(t.date) === week).sort((a, b) => a.date.localeCompare(b.date))
    $('list').innerHTML = list.length ? list.map((t) => `
      <article class="tw ${t.status === 'posted' ? 'posted' : ''}" data-id="${esc(t.id)}">
        <div class="head"><span class="day">${fmtDay(t.date, { weekday: 'long', day: 'numeric', month: 'long' })}</span><span class="chip">${esc(FAMILY[t.family] ?? t.family ?? '')}</span>
          <span class="state ${t.status === 'posted' ? 'done' : 'draft'}">${t.status === 'posted' ? 'نُشرت' : 'جاهزة للنشر'}</span></div>
        ${t.title ? `<p class="title">${esc(t.title)}</p>` : ''}
        <div class="body" dir="rtl" id="body-${esc(t.id)}">${deco(t.text)}</div>
        <div class="foot"><button class="btn primary" type="button" data-copy="${esc(t.id)}">نسخ</button>
          <button class="btn ${t.status === 'posted' ? 'ok' : ''}" type="button" data-post="${esc(t.id)}" aria-pressed="${t.status === 'posted'}">${t.status === 'posted' ? '✓ نشرتها' : 'علّم إنها نُشرت'}</button>
          <span class="count">${[...(t.text ?? '')].length} حرف</span></div>
        ${t.facts?.length ? `<details class="src"><summary>من وين الأرقام (${t.facts.length})</summary><ul>${t.facts.map((f) => `<li>${esc(f.claim)}: <b>${esc(f.value)}</b> — ${esc(f.source)}${f.as_of ? `، ${esc(f.as_of)}` : ''}</li>`).join('')}</ul></details>` : ''}
      </article>`).join('')
      : `<div class="empty"><b>${tweets.length ? 'ما فيه تغريدات بهالأسبوع' : 'للحين ما فيه تغريدات'}</b><p class="lead">كل يومين تنضاف تغريدة جديدة هنا تلقائياً.</p></div>`
    const used = new Map(tweets.map((t) => [t.idea, t.date]))
    $('ideas').innerHTML = ideas.map((x) => `<li><b>${esc(x.name_ar)}</b><span class="lead">${esc(x.angle)}</span>${used.has(x.key) ? `<span class="used">انكتبت ${fmtDay(used.get(x.key), { day: 'numeric', month: 'long' })}</span>` : ''}</li>`).join('')
    $('bank').hidden = !ideas.length
  }

  function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true }, 1800) }

  $('list').addEventListener('click', async (e) => {
    const c = e.target.closest('[data-copy]')
    if (c) {
      const t = tweets.find((x) => x.id === c.dataset.copy)
      try { await navigator.clipboard.writeText(t.text); toast('انتسخت') } catch {
        const r = document.createRange(); r.selectNodeContents($(`body-${t.id}`)); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('حدّدتها لك، انسخها')
      }
      return
    }
    const p = e.target.closest('[data-post]')
    if (p && db) {
      const t = tweets.find((x) => x.id === p.dataset.post)
      const status = t.status === 'posted' ? 'draft' : 'posted'
      p.disabled = true
      try { await db.collection('tweets').doc(t.id).update({ status, postedAt: status === 'posted' ? new Date().toISOString() : null }) } catch { toast('ما قدرت أحفظ. جرّب مرة ثانية.') }
      p.disabled = false
    }
  })
  $('prev').addEventListener('click', () => { const ws = weeks(); location.hash = 'w-' + ws[ws.indexOf(week) - 1] })
  $('next').addEventListener('click', () => { const ws = weeks(); location.hash = 'w-' + ws[ws.indexOf(week) + 1] })
  addEventListener('hashchange', () => { pick(); render() })

  pick(); render()
  ;(async () => {
    db = await window.claude?.use?.('db').catch?.(() => null) ?? null
    if (!db) { $('list').innerHTML = '<div class="empty"><b>ما قدرت أوصل للتغريدات المحفوظة</b><p class="lead">افتح الصفحة من claude.ai وأنت مسجل دخول.</p></div>'; return }
    db.collection('tweets').onSnapshot((snap) => {
      tweets = snap.docs.map((d) => ({ id: d.id, ...d.data() })).filter((t) => t.date && t.text)
      pick(); render()
    }, () => { $('list').innerHTML = '<div class="empty"><b>انقطع الاتصال بالتغريدات المحفوظة</b><p class="lead">حدّث الصفحة.</p></div>' })
    db.doc('meta/ideas').onSnapshot((d) => { ideas = d.exists ? (d.data().ideas ?? []) : []; render() }, () => {})
  })()
})()
</script>
