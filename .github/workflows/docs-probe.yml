name: Docs probe
on:
  push:
    branches: [probe/cboe]
    paths: ['.github/workflows/docs-probe.yml']
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          cat > /tmp/txt.py <<'PY'
          import sys, re, html
          from html.parser import HTMLParser
          class P(HTMLParser):
              def __init__(s): super().__init__(); s.out=[]; s.skip=0
              def handle_starttag(s,t,a):
                  if t in ('script','style','noscript'): s.skip+=1
              def handle_endtag(s,t):
                  if t in ('script','style','noscript') and s.skip: s.skip-=1
              def handle_data(s,d):
                  if not s.skip and d.strip(): s.out.append(d.strip())
          raw=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          p=P(); p.feed(raw); text=' | '.join(p.out)
          # Next.js pages carry their content in JSON; keep it too
          for m in re.findall(r'"(?:description|content|text)":"([^"]{20,400})"', raw): text += ' || ' + m
          keys=sys.argv[2].split(',')
          print('chars', len(text))
          for k in keys:
              for m in list(re.finditer(re.escape(k), text, re.I))[:4]:
                  print('['+k+']', text[max(0,m.start()-220):m.end()+260].replace('\n',' '))
          PY
          get() { echo; echo "######## $1"; curl -sSL -m 40 -o /tmp/p -w "HTTP %{http_code} final=%{url_effective}\n" -A 'mdt-signal-dashboard/1.0 (+https://github.com/AzezAlbassam/mdt-signal-dashboard)' "$1"; python3 /tmp/txt.py /tmp/p "$2" | head -c 6000; }
          get https://www.marketdata.app/docs/api/options/chain "bidSize,openInterest,delta,credit,feed,cached,expiration"
          get https://www.marketdata.app/docs/api/universal-parameters/feed "cached,live,delayed,credit"
          get https://www.marketdata.app/docs/api/rate-limiting "credit,daily,per minute,Free,Starter,Trader,concurrent"
          get https://www.marketdata.app/pricing/ "Free,Starter,Trader,month,credits,delayed,Options,commercial,personal,year"
          get https://docs.alpaca.markets/docs/historical-option-data "indicative,OPRA,delayed,free,Basic,modified"
          get https://docs.alpaca.markets/reference/optionchain "latestQuote,greeks,dailyBar,feed,indicative,limit"
          get https://docs.alpaca.markets/reference/get-options-contracts "open_interest,close_price,limit"
          get https://alpaca.markets/data "Options,indicative,Basic,Algo Trader,month,OPRA,delayed"
          get https://docs.tradier.com/ "sandbox,delayed,options,market data,account"
          get https://docs.tradier.com/reference/brokerage-api-markets-get-options-chains "bidsize,open_interest,greeks,sandbox"
          get https://eodhd.com/financial-apis/stock-options-data "bid,ask,volume,open_interest,delta,month,price,size"
