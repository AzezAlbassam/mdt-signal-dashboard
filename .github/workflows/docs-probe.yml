name: Docs probe
on:
  push:
    branches: [probe/cboe]
    paths: ['.github/workflows/docs-probe.yml']
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          cat > /tmp/txt.py <<'PY'
          import sys, re, html
          from html.parser import HTMLParser
          class P(HTMLParser):
              def __init__(s): super().__init__(); s.out=[]; s.skip=0
              def handle_starttag(s,t,a):
                  if t in ('script','style','noscript'): s.skip+=1
              def handle_endtag(s,t):
                  if t in ('script','style','noscript') and s.skip: s.skip-=1
              def handle_data(s,d):
                  if not s.skip and d.strip(): s.out.append(d.strip())
          raw=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          p=P(); p.feed(raw); text=' | '.join(p.out)
          # Next.js pages carry their content in JSON; keep it too
          for m in re.findall(r'"(?:description|content|text)":"([^"]{20,400})"', raw): text += ' || ' + m
          keys=sys.argv[2].split(',')
          print('chars', len(text))
          for k in keys:
              for m in list(re.finditer(re.escape(k), text, re.I))[:4]:
                  print('['+k+']', text[max(0,m.start()-220):m.end()+260].replace('\n',' '))
          PY
          get() { echo; echo "######## $1"; curl -sSL -m 40 -o /tmp/p -w "HTTP %{http_code} final=%{url_effective}\n" -A 'mdt-signal-dashboard/1.0 (+https://github.com/AzezAlbassam/mdt-signal-dashboard)' "$1"; python3 /tmp/txt.py /tmp/p "$2" | head -c 6000; }
          get https://documentation.tradier.com/brokerage-api/markets/get-options-chains "bidsize,open_interest,greeks,delta,expiration,Response"
          get https://documentation.tradier.com/brokerage-api/overview/rate-limiting "per minute,Market Data,sandbox,requests"
          get https://documentation.tradier.com/brokerage-api/overview/market-data "delayed,sandbox,real-time,15"
          get https://tradier.com/products/market-data-api "free,price,month,delayed,sandbox,options"
          get https://polygon.io/docs/rest/options/snapshots/option-chain-snapshot "last_quote,bid_size,open_interest,greeks,day,limit,Starter,plan"
          get https://polygon.io/pricing "Options,Starter,Developer,Advanced,month,delayed,Unlimited,Quotes,Greeks,Snapshot"
