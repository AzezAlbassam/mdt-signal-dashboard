name: Deploy static site to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
  # The daily data task deploys right after it pushes; this is the fallback if that dispatch
  # is missed (about 11:07 New York in winter, 12:07 in summer).
  schedule:
    - cron: '7 16 * * 1-5'
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Add options snapshots
        run: |
          # A failed fetch fails the deploy, so the live site keeps its data instead of losing it.
          for i in 1 2 3; do
            if git fetch --depth=1 origin options-data; then
              mkdir -p data/options && git archive FETCH_HEAD | tar -x -C data/options
              rm -rf data/options/history
              exit 0
            fi
            sleep $((i * 10))
          done
          rc=0; git ls-remote --exit-code --heads origin options-data >/dev/null || rc=$?
          [ "$rc" -eq 2 ] # no data branch yet: deploy the page without it
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
