name: Options liquidity snapshots
# Pulls delayed option chains from Cboe for the watchlist, keeps a rolling 20-session
# volume history on the `options-data` branch (one force-pushed commit, so the repo never
# grows), and redeploys the site after every pass so options.html shows fresh numbers.
#
# GitHub starts scheduled jobs late, sometimes by hours, so the schedule only *starts* a
# job; the job itself stays up through the session (options/snapshot.js --plan decides
# when to snapshot: about hourly between 10:00 and 15:50 New York, then once after the
# close for final volume). Several starters cover a late or dropped one; extras queue
# behind the running job and exit at once when there is nothing left to do.
on:
  schedule:
    - cron: '7 12,14,16,18 * * 1-5'
    - cron: '25 21 * * 1-5'
    - cron: '40 2 * * 2-6'
  workflow_dispatch:
    inputs:
      add:
        description: 'Tickers to add to the watchlist (comma separated, e.g. HOOD,RKLB)'
        required: false
        default: ''
      remove:
        description: 'Tickers to remove from the watchlist'
        required: false
        default: ''
      only:
        description: 'Refresh only these tickers (blank = whole watchlist)'
        required: false
        default: ''
      resummarize:
        description: 'Recompute every figure from the stored data with the current engine, fetching nothing'
        type: boolean
        required: false
        default: false
permissions:
  contents: write
  actions: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: options-data-${{ github.event_name == 'schedule' && 'session' || 'manual' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Engine tests
        run: node --test options/engine.test.js options/validate.test.js options/snapshot.test.js
      - name: Snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ADD: ${{ inputs.add }}
          REMOVE: ${{ inputs.remove }}
          ONLY: ${{ inputs.only }}
          RESUMMARIZE: ${{ inputs.resummarize }}
        run: |
          # Each pass starts from the branch as it is now, so a manual run in between is kept.
          # Only a branch that does not exist may start empty: a fetch that failed must never
          # turn into an empty tree that is then pushed over the history.
          restore() {
            rm -rf _data && mkdir -p _data
            for i in 1 2 3; do
              if git fetch -q --depth=1 origin options-data; then
                base=$(git rev-parse FETCH_HEAD)
                git archive FETCH_HEAD | tar -x -C _data
                return 0
              fi
              sleep $((i * 15))
            done
            base=''
            local rc=0; git ls-remote --exit-code --heads origin options-data >/dev/null || rc=$?
            [ "$rc" -eq 2 ]
          }
          # Push only over the commit this pass started from. If another run pushed meanwhile,
          # this push is refused and the next pass starts from that run's data instead.
          save_and_deploy() {
            (
              cd _data
              rm -rf .git && git init -q -b options-data
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git add -A
              git commit -q -m "Options snapshot $(date -u +%FT%TZ)"
              git push -q --force-with-lease="options-data:${base}" "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" options-data
            ) || return 1
            gh workflow run pages.yml --ref main -R "$REPO" || echo 'deploy dispatch failed'
          }

          # A failed pass (snapshot.js exits 1 on a source outage) is still saved — it only
          # adds flags — and the job keeps going, but ends red so the failure is noticed.
          # So does a pass whose numbers the independent check does not reproduce.
          failed=0
          if [ "$EVENT" != "schedule" ]; then
            for try in 1 2 3; do
              restore || { echo '::error::could not read the options-data branch'; exit 1; }
              if [ "$RESUMMARIZE" = "true" ]; then
                node options/snapshot.js _data --resummarize || failed=1
              else
                node options/snapshot.js _data --add "$ADD" --remove "$REMOVE" --only "$ONLY" || failed=1
              fi
              node options/validate.js _data --write || { echo '::warning::validation found problems'; failed=1; }
              save_and_deploy && exit $failed
              echo "::warning::options-data changed during this run; starting over ($try)"
              failed=0
            done
            exit 1
          fi

          # A pass can take 45 minutes (a 40-minute fetch budget, then checks and the push):
          # none may start so late that the 350-minute job limit kills it half-saved.
          deadline=$((SECONDS + 300 * 60))
          while [ $SECONDS -lt $deadline ]; do
            if ! restore; then
              echo '::warning::could not read the options-data branch; trying again in 5 minutes'
              failed=1; sleep 300; continue
            fi
            next=$(node options/snapshot.js _data --plan)
            echo "$(date -u +%H:%M) UTC → $next"
            case "$next" in
              run)
                node options/snapshot.js _data || failed=1
                node options/validate.js _data --write || { echo '::warning::validation found problems'; failed=1; }
                save_and_deploy || echo '::warning::options-data changed during this pass; the next pass starts from it' ;;
              wait*)
                s=${next#wait }
                [ $((SECONDS + s)) -ge $deadline ] && break
                sleep "$s" ;;
              *) break ;;
            esac
          done
          # ponytail: GitHub turns off schedules after 60 days without repository activity;
          # re-enabling through the API resets that clock without a commit.
          gh api -X PUT "repos/$REPO/actions/workflows/options-data.yml/enable" >/dev/null || true
          exit $failed
