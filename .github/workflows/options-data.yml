name: Options liquidity snapshots
# Pulls delayed option chains from Cboe for the watchlist, keeps a rolling 20-session
# volume history on the `options-data` branch (one force-pushed commit, so the repo never
# grows), and redeploys the site after every pass so options.html shows fresh numbers.
#
# GitHub starts scheduled jobs late, sometimes by hours, so the schedule only *starts* a
# job; the job itself stays up through the session (options/snapshot.js --plan decides
# when to snapshot: about hourly between 10:00 and 15:50 New York, then once after the
# close for final volume). Several starters cover a late or dropped one; extras queue
# behind the running job and exit at once when there is nothing left to do.
on:
  schedule:
    - cron: '7 12,14,16,18 * * 1-5'
    - cron: '25 21 * * 1-5'
    - cron: '40 2 * * 2-6'
  workflow_dispatch:
    inputs:
      add:
        description: 'Tickers to add to the watchlist (comma separated, e.g. HOOD,RKLB)'
        required: false
        default: ''
      remove:
        description: 'Tickers to remove from the watchlist'
        required: false
        default: ''
      only:
        description: 'Refresh only these tickers (blank = whole watchlist)'
        required: false
        default: ''
permissions:
  contents: write
  actions: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: options-data-${{ github.event_name == 'schedule' && 'session' || 'manual' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Engine tests
        run: node --test options/engine.test.js options/validate.test.js options/binance.test.js
      - name: Snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ADD: ${{ inputs.add }}
          REMOVE: ${{ inputs.remove }}
          ONLY: ${{ inputs.only }}
        run: |
          # Each pass starts from the branch as it is now, so a manual run in between is kept.
          restore() {
            rm -rf _data && mkdir -p _data
            if git fetch -q --depth=1 origin options-data; then git archive FETCH_HEAD | tar -x -C _data; fi
          }
          save_and_deploy() {
            (
              cd _data
              rm -rf .git && git init -q -b options-data
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git add -A
              git commit -q -m "Options snapshot $(date -u +%FT%TZ)"
              git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" options-data
            )
            gh workflow run pages.yml --ref main -R "$REPO" || echo 'deploy dispatch failed'
          }

          if [ "$EVENT" != "schedule" ]; then
            restore
            node options/snapshot.js _data --add "$ADD" --remove "$REMOVE" --only "$ONLY"
            node options/validate.js _data --write || echo '::warning::validation found problems'
            save_and_deploy
            exit 0
          fi

          deadline=$((SECONDS + 330 * 60))
          while [ $SECONDS -lt $deadline ]; do
            restore
            next=$(node options/snapshot.js _data --plan)
            echo "$(date -u +%H:%M) UTC → $next"
            case "$next" in
              run)
                node options/snapshot.js _data
                node options/validate.js _data --write || echo '::warning::validation found problems'
                save_and_deploy ;;
              wait*)
                s=${next#wait }
                [ $((SECONDS + s)) -ge $deadline ] && break
                sleep "$s" ;;
              *) break ;;
            esac
          done
