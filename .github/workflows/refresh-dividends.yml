name: Refresh dividend data
on:
  schedule:
    # Mondays at 12:00 UTC, after the US market has had a week of closes
    - cron: '0 12 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh prices
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: node tools/refresh-dividends.mjs
      - name: Commit if anything changed
        run: |
          if git diff --quiet -- dividend-data.json; then
            echo "No change."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dividend-data.json
          git commit -m "Refresh dividend screen prices"
          git push
