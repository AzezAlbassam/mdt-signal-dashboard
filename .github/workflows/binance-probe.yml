name: Binance probe
on:
  push:
    branches: [probe/binance]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in \
            "https://eapi.binance.com/eapi/v1/ping" \
            "https://eapi.binance.com/eapi/v1/exchangeInfo" \
            "https://eapi.binance.com/eapi/v1/ticker" \
            "https://eapi.binance.com/eapi/v1/mark" \
            "https://eapi.binance.com/eapi/v1/index?underlying=BTCUSDT" \
            "https://api.binance.com/api/v3/ping" ; do
            echo "== $u"
            curl -sS -m 20 -D - -o /tmp/b -H "Origin: https://azezalbassam.github.io" "$u" | grep -iE "^HTTP|access-control|content-length" || true
            head -c 600 /tmp/b; echo
          done
          echo "== sizes"
          curl -sS -m 30 https://eapi.binance.com/eapi/v1/exchangeInfo | python3 -c "import sys,json; d=json.load(sys.stdin); s=d.get('optionSymbols',[]); print(len(s)); print(s[:2]); print(sorted(set(x['underlying'] for x in s))); print(d.get('optionContracts'))" || true
          curl -sS -m 30 https://eapi.binance.com/eapi/v1/ticker | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d)); print(d[:2])" || true
          curl -sS -m 30 "https://eapi.binance.com/eapi/v1/openInterest?underlyingAsset=BTC&expiration=$(date -u -d 'next friday' +%y%m%d)" | head -c 800; echo
          curl -sS -m 30 https://eapi.binance.com/eapi/v1/mark | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d)); print(d[:1])" || true
