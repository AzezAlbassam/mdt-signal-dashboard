name: Cboe probe
on:
  push:
    branches: [probe/cboe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          HONEST='mdt-signal-dashboard/1.0 (+https://github.com/AzezAlbassam/mdt-signal-dashboard)'
          for t in ROKU SATS; do
            echo "== OCC series search $t"
            curl -sS -m 30 -D /tmp/h -o /tmp/b -A "$HONEST" "https://marketdata.theocc.com/series-search?symbolType=U&symbol=$t"
            grep -iE '^HTTP|^content-type|^server' /tmp/h
            echo "lines: $(wc -l < /tmp/b)"; head -c 900 /tmp/b; echo; echo ...; tail -c 300 /tmp/b; echo
          done
