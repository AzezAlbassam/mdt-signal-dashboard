name: Cboe probe
on:
  push:
    branches: [probe/cboe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36'
          echo "== cboe redirect target"
          curl -sS -m 20 -D - -o /dev/null -A "$UA" https://cdn.cboe.com/api/global/delayed_quotes/options/NVDA.json | grep -iE '^HTTP|^location|^cf-mitigated|^server' || true
          echo "== nasdaq option chain"
          curl -sS -m 25 -D /tmp/h -o /tmp/b -A "$UA" -H 'Accept: application/json, text/plain, */*' -H 'Origin: https://www.nasdaq.com' -H 'Referer: https://www.nasdaq.com/' \
            'https://api.nasdaq.com/api/quote/NVDA/option-chain?assetclass=stocks&limit=5000&fromdate=all&todate=undefined&excode=oprac&callput=callput&money=all&type=all' || true
          grep -iE '^HTTP|^content-type|^content-length' /tmp/h || true
          python3 -c "import json;d=json.load(open('/tmp/b'));t=d.get('data') or {};r=(t.get('table') or {}).get('rows') or [];print('rows',len(r));print(r[:2]);print({k:v for k,v in t.items() if k!='table'})" 2>&1 | head -c 1500; echo
          echo "== yahoo options (crumb flow)"
          rm -f /tmp/cj
          curl -sS -m 20 -c /tmp/cj -o /dev/null -A "$UA" https://fc.yahoo.com || true
          CRUMB=$(curl -sS -m 20 -b /tmp/cj -A "$UA" https://query2.finance.yahoo.com/v1/test/getcrumb || true)
          echo "crumb=[$CRUMB]"
          curl -sS -m 25 -D /tmp/h -o /tmp/b -b /tmp/cj -A "$UA" "https://query2.finance.yahoo.com/v7/finance/options/NVDA?crumb=$CRUMB" || true
          grep -iE '^HTTP|^content-type' /tmp/h || true
          python3 -c "import json;d=json.load(open('/tmp/b'));r=d['optionChain']['result'][0];print('expiries',len(r['expirationDates']));o=r['options'][0];print('calls',len(o['calls']),'puts',len(o['puts']));print(o['calls'][len(o['calls'])//2])" 2>&1 | head -c 1500; echo
