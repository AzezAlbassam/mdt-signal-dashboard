name: Cboe probe
on:
  push:
    branches: [probe/cboe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36'
          U=https://cdn-api.cboe.com/api/global/delayed_quotes/options/NVDA.json
          try() { echo "== $1"; shift; curl -sS -m 20 -D /tmp/h -o /tmp/b "$@" "$U" || true; grep -iE '^HTTP|^content-type|^cf-mitigated|^location' /tmp/h || true; head -c 200 /tmp/b | tr -d '\r\n'; echo; }
          try "bare"
          try "ua" -A "$UA"
          try "ua+accept" -A "$UA" -H 'Accept: application/json, text/plain, */*'
          try "ua+referer+origin" -A "$UA" -H 'Accept: application/json, text/plain, */*' -H 'Referer: https://www.cboe.com/' -H 'Origin: https://www.cboe.com'
          try "full browser" -A "$UA" -H 'Accept: application/json, text/plain, */*' -H 'Accept-Language: en-US,en;q=0.9' -H 'Referer: https://www.cboe.com/' -H 'Origin: https://www.cboe.com' -H 'Sec-Fetch-Site: same-site' -H 'Sec-Fetch-Mode: cors' -H 'Sec-Fetch-Dest: empty'
          echo "== node fetch, browser headers"
          node -e '
            const h={"User-Agent":process.argv[1],Accept:"application/json, text/plain, */*",Referer:"https://www.cboe.com/",Origin:"https://www.cboe.com"}
            fetch("https://cdn-api.cboe.com/api/global/delayed_quotes/options/NVDA.json",{headers:h}).then(async r=>{const t=await r.text();console.log(r.status,t.slice(0,160));if(r.ok){const d=JSON.parse(t).data;console.log("options",d.options.length,Object.keys(d.options[0]).join(","))}}).catch(e=>console.log("ERR",e.message))' "$UA"
          echo "== 20 tickers in a row (rate check)"
          for t in AAPL MSFT AMZN META TSLA AMD PLTR MSTR COIN HOOD IBIT SPY QQQ IWM SMCI AVGO NFLX UBER HIMS RKLB; do
            printf "%s " "$t"; curl -sS -m 20 -o /dev/null -w "%{http_code}\n" -A "$UA" -H 'Accept: application/json, text/plain, */*' -H 'Referer: https://www.cboe.com/' -H 'Origin: https://www.cboe.com' "https://cdn-api.cboe.com/api/global/delayed_quotes/options/$t.json" || true
          done
