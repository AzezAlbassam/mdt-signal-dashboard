name: Cboe probe
on:
  push:
    branches: [probe/cboe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          HONEST='mdt-signal-dashboard/1.0 (+https://github.com/AzezAlbassam/mdt-signal-dashboard)'
          rm -f /tmp/cj
          curl -sS -m 20 -c /tmp/cj -o /dev/null -w "fc %{http_code}\n" -A "$HONEST" https://fc.yahoo.com
          CRUMB=$(curl -sS -m 20 -b /tmp/cj -A "$HONEST" https://query2.finance.yahoo.com/v1/test/getcrumb)
          echo "crumb=[$CRUMB]"
          y() { curl -sS -m 25 -o /tmp/b -w "%{http_code}" -b /tmp/cj -A "$HONEST" "https://query2.finance.yahoo.com/v7/finance/options/$1?crumb=$CRUMB$2"; }
          echo "NVDA $(y NVDA '')"; python3 -c "
          import json;d=json.load(open('/tmp/b'));r=d['optionChain']['result'][0];o=r['options'][0]
          print('expiries',len(r['expirationDates']),'calls',len(o['calls']));c=o['calls'][len(o['calls'])//2];print(sorted(c.keys()));print(c)"
          echo "== 30 calls in a row"
          for t in AAPL MSFT AMZN META TSLA AMD PLTR MSTR COIN HOOD IBIT QQQ IWM SMCI AVGO NFLX UBER HIMS RKLB OKLO SOXX XLK SLV TAN KWEB CIBR MAGS QQQM SPMO DTCR; do printf "%s:%s " "$t" "$(y $t '')"; done; echo
