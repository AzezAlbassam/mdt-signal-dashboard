name: Cboe probe
on:
  push:
    branches: [probe/cboe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          HONEST='mdt-signal-dashboard/1.0 (+https://github.com/AzezAlbassam/mdt-signal-dashboard)'
          for t in AAPL NVDA SPY IBIT CTM AENT SLNH GDLC GXRP SKYT AXIA SKYQ SATS FUSE RAYA UCAR AIXI SQFT ELAB CREG BBGI ROKU LNKS ONCO UGRO SWMR SAFX ARAI BATL BENF ISPC DVLT CYCN FUTU ANNA TMDE PSKY WBD HIVE CUE SMX QNCX GLMD OMEX CTRA DKI PFSA CLIK CVV STI SSSS STRK BGIN INDV AEI TYGO MRKR FUFU ANL JAGU XRP GLNK BRR CEPL SCWO HGX LHAI INKT HUBC SOXX VOO SLV XLK XLE XLV XLF MAGS QQQM CIBR SPMO KWEB TAN NCLD LYTE SEMI DTCR CHAT; do
            curl -sS -m 30 -A "$HONEST" -o /tmp/b "https://marketdata.theocc.com/series-search?symbolType=U&symbol=$t"
            n=$(awk -F'\t' '$3 ~ /^[0-9][0-9][0-9][0-9]$/ {c++} END {print c+0}' /tmp/b)
            oi=$(awk -F'\t' '$3 ~ /^[0-9][0-9][0-9][0-9]$/ {s+=$8+$9} END {print s+0}' /tmp/b)
            nd=$(grep -c 'No data exists' /tmp/b)
            echo "OCC $t series=$n oi=$oi nodata=$nd"; sleep 0.3
          done
