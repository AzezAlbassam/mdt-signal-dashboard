<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<style>
*{box-sizing:border-box;margin:0}
body{background:#E9E7E1;color:#111;font-family:"IBM Plex Sans Arabic";overflow:hidden}
.wrap{position:absolute;inset:0;padding:40px 56px 30px;display:flex;flex-direction:column}

.note{font:500 17px "IBM Plex Sans Arabic";color:#6B6962;direction:rtl}
.chart{position:relative;flex:1;margin-top:18px;min-height:0}
.plot{position:absolute;inset:0 0 34px 0;display:flex;align-items:flex-end;gap:14px;direction:ltr}

.col.hi .bar{background:#111}
.v{font:600 18px "IBM Plex Mono";color:#6B6962;margin-bottom:6px;position:relative;z-index:3;background:#E9E7E1;padding:0 4px}
.col.hi .v{font:700 28px "IBM Plex Mono";color:#111}
.axis{position:absolute;left:0;right:0;bottom:0;height:34px;display:flex;gap:14px;direction:ltr;border-top:2px solid #111;padding-top:6px}
.axis span{flex:1;text-align:center;font:500 15px "IBM Plex Mono";color:#6B6962}
.ref{position:absolute;left:0;right:0;border-top:2px dashed #111;z-index:2}
.ref b{position:absolute;left:44%;top:8px;font:600 16px "IBM Plex Sans Arabic";background:#E9E7E1;padding:0 6px;direction:rtl}
.tiles{display:flex;gap:16px;margin-top:26px}
.tile{flex:1;background:#fff;border:2px solid #111;padding:16px 20px;display:flex;flex-direction:column}
.tile.k{background:#111;color:#fff}.tile.k .l,.tile.k .s{color:#C9C6BE}

.tile .n{font:700 76px "IBM Plex Mono";direction:ltr;text-align:right;margin:8px 0 4px}
.tile .s{font:500 16px "IBM Plex Sans Arabic";color:#6B6962;margin-top:6px}
.explain{margin-top:22px;font:700 24px "IBM Plex Sans Arabic";border:2px solid #111;background:#fff;padding:8px 14px}
.n2{direction:ltr;unicode-bidi:isolate;display:inline-block}
.fv{margin-top:14px;display:flex;flex-direction:column;gap:4px;font:500 18px "IBM Plex Sans Arabic";color:#6B6962}.fv b{font:700 22px "IBM Plex Sans Arabic";color:#111}
</style><body><div class="wrap" id="w"></div>
