<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8">
<!-- Tweet 2026-11-19: who bought Anthropic's $26B private placement next to its IPO. Amounts: Anthropic S-1/A (SEC), as reported 2026-11-18/19. 1200x675. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:675px;background:#E9E7E1;color:#111;font-family:"IBM Plex Sans Arabic";overflow:hidden}
.wrap{position:absolute;inset:0;padding:38px 56px 28px;display:flex;flex-direction:column}
.kick{font:600 19px "IBM Plex Sans Arabic";background:#111;color:#fff;align-self:flex-start;padding:2px 12px;margin-bottom:8px}
h1{font:900 38px/1.3 "Noto Kufi Arabic"}
.sub{font:500 20px "IBM Plex Sans Arabic";color:#6B6962;margin-top:2px}
.rows{margin-top:20px;display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:110px 1fr 100px 200px;align-items:center;gap:16px;direction:ltr}
.tk{font:700 24px "IBM Plex Mono"}
.bar{height:26px;background:#fff;border:2px solid #111}.bar.k{background:#111}
.v{font:700 24px "IBM Plex Mono";text-align:right}
.w{font:500 18px "IBM Plex Sans Arabic";color:#6B6962;direction:rtl;text-align:right}
.total{margin-top:12px;display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid #111;padding-top:8px;font:700 22px "Noto Kufi Arabic"}
.total b{font:700 28px "IBM Plex Mono";direction:ltr}
.foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:12px;border-top:2px solid #111;direction:ltr}
.me{display:flex;align-items:center;gap:12px;font:700 22px "IBM Plex Mono"}
.x{width:38px;height:38px;border-radius:4px;background:#111;display:grid;place-items:center}.x svg{width:22px;height:22px;fill:#fff}
.note{font:500 16px "IBM Plex Sans Arabic";color:#6B6962;direction:rtl}
</style><body><div class="wrap" id="w"></div>
<script>
const R=[['NVDA','شرائح',10],['GOOGL','شرائح TPU + سحابة',10],['AMD','شرائح',2.5],['AVGO','شرائح مخصصة',1],['MU','ذاكرة',1],['MSFT','سحابة',1],['TSM','تصنيع الشرائح',0.5]]
const X='<div class="x"><svg viewBox="0 0 24 24"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"/></svg></div>'
document.getElementById('w').innerHTML=`<div class="kick">طرح أنثروبيك ANT · الصفقة الجانبية</div>
<h1>اللي يبيعون لأنثروبيك… اشتروا من أسهمها</h1>
<div class="sub">7 شركات اشترت أسهم بسعر الطرح، وكلها تبيع لأنثروبيك شي</div>
<div class="rows">${R.map(([t,w,v],i)=>`<div class="row"><div class="tk">${t}</div><div><div class="bar ${i<2?'k':''}" style="width:${v/10*100}%"></div></div><div class="v">$${v}B</div><div class="w">${w}</div></div>`).join('')}</div>
<div class="total"><span>المجموع</span><b>$26B</b></div>
<div class="foot"><div class="me">${X}@AzizzUnited</div><div class="note">المبالغ من نشرة الطرح المعدلة (S-1/A) · 19 نوفمبر 2026 · مو توصية</div></div>`
</script>
